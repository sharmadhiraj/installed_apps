name: installed_apps
description: List installed apps on Android, get app info and icons, launch, uninstall and open app settings. Filter by package name, system apps or platform.
version: 2.2.0
repository: https://github.com/sharmadhiraj/installed_apps
issue_tracker: https://github.com/sharmadhiraj/installed_apps/issues
topics:
  - android
  - apps
  - package-manager
  - installed-apps
  - app-list

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sharmadhiraj.installed_apps
        pluginClass: InstalledAppsPlugin